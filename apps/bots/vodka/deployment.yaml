apiVersion: apps/v1
kind: Deployment
metadata:
  name: vodka
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vodka
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: vodka
    spec:
      containers:
        - name: vodka
          image: ghcr.io/nasus20202/vodka:1.185.0@sha256:2b723c8abc98a68cb1a6f3471bd854398ba6b00c555de5daf75f2214adc638e5
          envFrom:
            - configMapRef:
                name: vodka-cm
            - secretRef:
                name: vodka-secret
          resources:
            requests:
              memory: 50Mi
              cpu: 10m
            limits:
              memory: 100Mi
          volumeMounts:
            - name: vodka-data
              mountPath: "/app/data"
      volumes:
        - name: vodka-data
          persistentVolumeClaim:
            claimName: vodka-pvc
