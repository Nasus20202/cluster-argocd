apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: harbor
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: registry-1.docker.io/bitnamicharts
      chart: harbor
      targetRevision: "26.8.0"
      helm:
        valueFiles:
          - $values/apps/harbor/values.yaml
    - repoURL: https://github.com/Nasus20202/cluster-argocd.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/Nasus20202/cluster-argocd.git
      targetRevision: main
      path: apps/harbor/manifests
  destination:
    name: in-cluster
    namespace: harbor
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
