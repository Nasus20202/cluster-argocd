apiVersion: apps/v1
kind: Deployment
metadata:
  name: logenz
spec:
  replicas: 1
  selector:
    matchLabels:
      app: logenz
  template:
    metadata:
      labels:
        app: logenz
    spec:
      containers:
        - name: logenz
          image: ghcr.io/nasus20202/logenz:1.120.0@sha256:e18f9242dbda1f1a6761f8c0b3c7ba71aa600e632cc0adcc84f4b25f244cbfb8
          envFrom:
            - secretRef:
                name: logenz-secret
          resources:
            requests:
              memory: 50Mi
              cpu: 10m
            limits:
              memory: 100Mi
