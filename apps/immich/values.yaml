immich:
  persistence:
    library:
      existingClaim: immich-library-pvc

server:
  controllers:
    main:
      containers:
        main:
          image:
            repository: ghcr.io/immich-app/immich-server
            tag: v3.4.2@sha256:fc880c1bf665b4aab1e74c15e56ab871225989cd546536e6b77e771869af06bd
          env:
            DB_HOSTNAME: immich-postgres-rw
            DB_DATABASE_NAME: immich
            DB_USERNAME:
              secretKeyRef:
                name: pg-immich
                key: username
            DB_PASSWORD:
              secretKeyRef:
                name: pg-immich
                key: password
          resources:
            requests:
              cpu: 25m
              memory: 500Mi
            limits:
              memory: 1Gi
  ingress:
    main:
      enabled: true
      annotations:
        cert-manager.io/cluster-issuer: "letsencrypt-prod"
      hosts:
        - host: immich.nasus.dev
          paths:
            - path: "/"
      tls:
        - hosts:
            - immich.nasus.dev
          secretName: immich-tls

valkey:
  enabled: true
  controllers:
    main:
      containers:
        main:
          resources:
            requests:
              cpu: 20m
              memory: 25Mi
            limits:
              memory: 50Mi

machine-learning:
  controllers:
    main:
      containers:
        main:
          image:
            repository: ghcr.io/immich-app/immich-machine-learning
            tag: v3.4.2@sha256:739405742a79bd7447227c553bb62ed5491aa36acf00bc667af7f9c93b6fae91
          resources:
            requests:
              cpu: 10m
              memory: 250Mi
            limits:
              memory: 2Gi
