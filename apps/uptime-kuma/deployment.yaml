apiVersion: apps/v1
kind: Deployment
metadata:
  name: uptime-kuma
spec:
  replicas: 1
  selector:
    matchLabels:
      app: uptime-kuma
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: uptime-kuma
    spec:
      containers:
        - name: uptime-kuma
          image: louislam/uptime-kuma:2.0.0-beta.4
          ports:
            - name: http
              containerPort: 3001
          resources:
            requests:
              memory: 500Mi
              cpu: 100m
          readinessProbe:
            exec:
              command:
                - extra/healthcheck
          volumeMounts:
            - name: uptime-kuma-data
              mountPath: "/app/data"
      volumes:
        - name: uptime-kuma-data
          persistentVolumeClaim:
            claimName: uptime-kuma-pvc
