apiVersion: apps/v1
kind: Deployment
metadata:
  name: janr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: janr
  template:
    metadata:
      labels:
        app: janr
    spec:
      containers:
        - name: janr
          image: ghcr.io/nasus20202/janr:1.333.0@sha256:f2788dcf05ee42cb17a7108a3bdc4da1c9331ab31f874b78e41620b4c61b1137
          envFrom:
            - configMapRef:
                name: janr-cm
            - secretRef:
                name: janr-secret
          resources:
            requests:
              memory: 100Mi
              cpu: 10m
            limits:
              memory: 200Mi
      imagePullSecrets:
        - name: janr-registry-secret
