apiVersion: apps/v1
kind: Deployment
metadata:
  name: paczka
spec:
  replicas: 1
  selector:
    matchLabels:
      app: paczka
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: paczka
    spec:
      containers:
        - name: paczka
          image: gtstef/filebrowser:2.0.2-stable@sha256:de2b4c4d18485ea202ab2cdada5bd25d8f0b8ed071712c8216a67194c31285ae
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 30m
              memory: 300Mi
            limits:
              memory: 600Mi
          env:
            - name: FILEBROWSER_CONFIG
              value: "/home/filebrowser/config.yaml"
          readinessProbe:
            httpGet:
              path: /health
              port: http
          volumeMounts:
            - name: paczka
              mountPath: /paczka
            - name: config
              mountPath: /home/filebrowser/config.yaml
              subPath: config.yaml
      initContainers:
        - name: nginx
          image: nginx:1.31.8-alpine@sha256:b2f80f8f88146b0772fdcc7d92cea621aa8c2889fa8d07ed61d4884fcea53e09
          restartPolicy: Always
          ports:
            - name: http-nginx
              containerPort: 8080
          resources:
            requests:
              memory: 10Mi
            limits:
              memory: 20Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http-nginx
          volumeMounts:
            - name: nginx-snippets
              mountPath: /etc/nginx/conf.d
      volumes:
        - name: paczka
          persistentVolumeClaim:
            claimName: paczka-pvc
        - name: config
          configMap:
            name: paczka-config
        - name: nginx-snippets
          configMap:
            name: paczka-nginx-snippets
