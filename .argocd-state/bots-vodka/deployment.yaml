apiVersion: apps/v1
kind: Deployment
metadata:
  name: vodka
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vodka
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: vodka
    spec:
      containers:
        - name: vodka
          image: ghcr.io/nasus20202/vodka:1.189.0@sha256:216aea7c603b83a6eda0dfb23cdde24997da4a1dad59e7542dd2cc8736604f6f
          envFrom:
            - configMapRef:
                name: vodka-cm
            - secretRef:
                name: vodka-secret
          resources:
            requests:
              memory: 50Mi
              cpu: 10m
            limits:
              memory: 100Mi
          volumeMounts:
            - name: vodka-data
              mountPath: "/app/data"
      volumes:
        - name: vodka-data
          persistentVolumeClaim:
            claimName: vodka-pvc
