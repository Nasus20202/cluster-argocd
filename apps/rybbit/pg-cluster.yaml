apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: rybbit-postgres
spec:
  instances: 1
  primaryUpdateStrategy: unsupervised
  imageName: ghcr.io/cloudnative-pg/postgresql:18.2
  storage:
    size: 1Gi
  resources:
    requests:
      cpu: 20m
      memory: 125Mi
    limits:
      memory: 250Mi
  bootstrap:
    initdb:
      database: rybbit
      owner: rybbit
      secret:
        name: pg-rybbit
