apiVersion: apps/v1
kind: Deployment
metadata:
  name: janr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: janr
  template:
    metadata:
      labels:
        app: janr
    spec:
      containers:
        - name: janr
          image: ghcr.io/nasus20202/janr:1.321.0@sha256:d2ab90845daaa9e2565bcad36f90dc7d4634bd4c6b7429cb1695e19266408d9e
          envFrom:
            - configMapRef:
                name: janr-cm
            - secretRef:
                name: janr-secret
          resources:
            requests:
              memory: 100Mi
              cpu: 10m
            limits:
              memory: 200Mi
      imagePullSecrets:
        - name: janr-registry-secret
