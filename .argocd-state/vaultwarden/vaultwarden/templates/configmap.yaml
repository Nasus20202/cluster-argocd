---
# Source: vaultwarden/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: vaultwarden
  namespace: vaultwarden
  labels:
    app.kubernetes.io/component: vaultwarden
    helm.sh/chart: vaultwarden-0.43.0
    app.kubernetes.io/name: vaultwarden
    app.kubernetes.io/instance: vaultwarden
    app.kubernetes.io/version: "1.36.0"
    app.kubernetes.io/managed-by: Helm
data:
  DOMAIN: "https://vault.nasus.dev"
  SMTP_HOST: "smtp.purelymail.com"
  SMTP_SECURITY: "force_tls"
  SMTP_PORT: "465"
  SMTP_AUTH_MECHANISM: "Plain"
  SMTP_FROM: "vault@nasus.dev"
  SMTP_FROM_NAME: "Nasus Vault"
  SMTP_DEBUG: "false"
  SMTP_ACCEPT_INVALID_HOSTNAMES: "false"
  SMTP_ACCEPT_INVALID_CERTS: "false"
  DATA_FOLDER: "/data"
  ROCKET_ADDRESS: "0.0.0.0"
  ROCKET_PORT: "8080"
  ROCKET_WORKERS: "10"
  SHOW_PASSWORD_HINT: "false"
  SIGNUPS_ALLOWED: "false"
  INVITATIONS_ALLOWED: "true"
  SIGNUPS_VERIFY: "true"
  WEB_VAULT_ENABLED: "true"
  DB_CONNECTION_RETRIES: "15"
  DATABASE_MAX_CONNS: "10"
  DATABASE_TIMEOUT: "30"
  DATABASE_IDLE_TIMEOUT: "600"
  DATABASE_MIN_CONNS: "2"
  ENABLE_DB_WAL: "true"
  INVITATION_ORG_NAME: "Nasus Vault"
  ICON_BLACKLIST_NON_GLOBAL_IPS: "true"
  IP_HEADER: "X-Real-IP"
  ORG_EVENTS_ENABLED: "false"
  ORG_GROUPS_ENABLED: "false"
  SENDS_ALLOWED: "true"
  EMERGENCY_ACCESS_ALLOWED: "true"
  EMERGENCY_NOTIFICATION_REMINDER_SCHEDULE: "0 3 * * * *"
  EMERGENCY_REQUEST_TIMEOUT_SCHEDULE: "0 7 * * * *"
  EXTENDED_LOGGING: "true"
  LOG_TIMESTAMP_FORMAT: "%Y-%m-%d %H:%M:%S.%3f"
  ICON_SERVICE: "internal"
  ICON_REDIRECT_CODE: "302"
  INVITATION_EXPIRATION_HOURS: "120"
  REQUIRE_DEVICE_EMAIL: "false"
  TRASH_AUTO_DELETE_DAYS: ""
  TZ: "Europe/Warsaw"
  EMAIL_CHANGE_ALLOWED: "true"
  ADMIN_RATELIMIT_SECONDS: "300"
  ADMIN_RATELIMIT_MAX_BURST: "3"

