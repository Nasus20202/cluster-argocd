apiVersion: apps/v1
kind: Deployment
metadata:
  name: ralphkaminski
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ralphkaminski
  template:
    metadata:
      labels:
        app: ralphkaminski
    spec:
      containers:
        - name: ralphkaminski
          image: ghcr.io/nasus20202/ralphkaminski:1.346.0@sha256:a60434053d5bf6aa0acb5ea51ae1b085ae417d030e1af109d21b108bfb673f39
          envFrom:
            - configMapRef:
                name: ralphkaminski-cm
            - secretRef:
                name: ralphkaminski-secret
          resources:
            requests:
              memory: 300Mi
              cpu: 10m
            limits:
              memory: 600Mi
