apiVersion: apps/v1
kind: Deployment
metadata:
  name: qrnroll
spec:
  replicas: 2
  selector:
    matchLabels:
      app: qrnroll
  template:
    metadata:
      labels:
        app: qrnroll
    spec:
      containers:
        - name: qrnroll
          image: ghcr.io/nasus20202/qrnroll:1.1395.0@sha256:8dc3d67d7442e9919be3aa4ad84263715a15692dcc7ad201a4c28e141813c47c
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: VALKEY_URL
              value: "valkey://qrnroll-valkey:6379"
            - name: TRACKING_SCRIPT
              value: '<script src="https://rybbit.nasus.dev/api/script.js" data-site-id="5d0970295e63" defer></script>'
          envFrom:
            - secretRef:
                name: qrnroll-secret
          readinessProbe:
            httpGet:
              path: /
              port: http
          resources:
            requests:
              cpu: 10m
              memory: 75Mi
            limits:
              memory: 150Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qrnroll-valkey
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qrnroll-valkey
  template:
    metadata:
      labels:
        app: qrnroll-valkey
    spec:
      containers:
        - name: valkey
          image: valkey/valkey:9.2.0-alpine@sha256:4d67e1af80c653bd46c0bbe8de438c81a6535ab5a39b22f2100028f314005663
          ports:
            - containerPort: 6379
              name: valkey
          resources:
            requests:
              cpu: 10m
              memory: 10Mi
            limits:
              memory: 20Mi
          readinessProbe:
            tcpSocket:
              port: valkey
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
