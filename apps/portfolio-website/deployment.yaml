apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio-website
spec:
  replicas: 3
  selector:
    matchLabels:
      app: portfolio-website
  template:
    metadata:
      labels:
        app: portfolio-website
    spec:
      containers:
        - name: portfolio-website
          image: ghcr.io/nasus20202/portfolio-website:2.917.0@sha256:68d176561510ca818328edba4e4d53a87690d2341a2d9e50541c8295a4cb2061
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
          resources:
            requests:
              cpu: 10m
              memory: 10Mi
            limits:
              memory: 10Mi
          volumeMounts:
            - name: nginx-snippets
              mountPath: /etc/nginx/conf.d/rybbit-subfilter.conf
              subPath: rybbit-subfilter.conf
      volumes:
        - name: nginx-snippets
          configMap:
            name: nginx-snippets
