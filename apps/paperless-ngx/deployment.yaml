apiVersion: apps/v1
kind: Deployment
metadata:
  name: paperless-ngx-valkey
spec:
  replicas: 1
  selector:
    matchLabels:
      app: paperless-ngx-valkey
  template:
    metadata:
      labels:
        app: paperless-ngx-valkey
    spec:
      containers:
        - name: valkey
          image: valkey/valkey:9.2.0-alpine@sha256:c8e2d17498838af5d91e12eb7c11220b3434a7b7131a333e3af52ad5e0b80882
          ports:
            - containerPort: 6379
              name: valkey
          resources:
            requests:
              cpu: 10m
              memory: 15Mi
            limits:
              memory: 30Mi
          readinessProbe:
            tcpSocket:
              port: valkey
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paperless-ngx-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: paperless-ngx-server
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: paperless-ngx-server
    spec:
      containers:
        - name: paperless-ngx
          image: ghcr.io/paperless-ngx/paperless-ngx:3.5.1@sha256:8508853b8a0f8394074260957d0be186c8c64f346973b24a7583de4580f306b9
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: PAPERLESS_DBPASS
              valueFrom:
                secretKeyRef:
                  name: pg-paperless
                  key: password
          envFrom:
            - configMapRef:
                name: paperless-ngx-config
            - secretRef:
                name: paperless-ngx-secret
            - secretRef:
                name: paperless-ngx-oidc-config
          resources:
            requests:
              cpu: 10m
              memory: 600Mi
            limits:
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /
              port: http
          volumeMounts:
            - name: data
              mountPath: /usr/src/paperless/data
              subPath: data
            - name: data
              mountPath: /usr/src/paperless/media
              subPath: media
            - name: temporary
              mountPath: /usr/src/paperless/export
              subPath: export
            - name: temporary
              mountPath: /usr/src/paperless/consume
              subPath: consume
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: paperless-ngx-pvc
        - name: temporary
          emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paperless-ngx-tika
spec:
  replicas: 1
  selector:
    matchLabels:
      app: paperless-ngx-tika
  template:
    metadata:
      labels:
        app: paperless-ngx-tika
    spec:
      containers:
        - name: tika
          image: apache/tika:3.3.3.0@sha256:326b238b37904c94ff61fed87afe0af72e6a29fa715933b10af97b7d56f1d4cb
          ports:
            - containerPort: 9998
              name: http
          resources:
            requests:
              cpu: 10m
              memory: 200Mi
            limits:
              memory: 500Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paperless-ngx-gotenberg
spec:
  replicas: 1
  selector:
    matchLabels:
      app: paperless-ngx-gotenberg
  template:
    metadata:
      labels:
        app: paperless-ngx-gotenberg
    spec:
      containers:
        - name: gotenberg
          image: gotenberg/gotenberg:9.9.0@sha256:2f4945f698c3d02f691a27d56bb8e7ba4585e6ab50bd233329a36eb0423ae587
          command:
            [
              "gotenberg",
              "--chromium-disable-javascript=true",
              "--chromium-allow-list=file:///tmp/.*",
            ]
          ports:
            - containerPort: 3000
              name: http
          readinessProbe:
            httpGet:
              path: /health
              port: http
          resources:
            requests:
              cpu: 10m
              memory: 50Mi
            limits:
              memory: 500Mi
