apiVersion: apps/v1
kind: Deployment
metadata:
  name: maybe-finance-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: maybe-finance-web
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: maybe-finance-web
    spec:
      initContainers:
        - name: chown-data
          image: busybox
          imagePullPolicy: IfNotPresent
          command: ["chown", "-R", "1000:1000", "/data"]
          volumeMounts:
            - name: data
              mountPath: "/data"
      containers:
        - name: web
          image: ghcr.io/maybe-finance/maybe:0.5.0
          ports:
            - containerPort: 3000
              name: http
          resources:
            requests:
              memory: 300Mi
          readinessProbe:
            httpGet:
              path: /up
              port: http
          envFrom:
            - configMapRef:
                name: maybe-finance-config
            - secretRef:
                name: maybe-finance-secret
          volumeMounts:
            - name: data
              mountPath: /rails/storage
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: maybe-finance-pvc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: maybe-finance-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: maybe-finance-worker
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: maybe-finance-worker
    spec:
      containers:
        - name: worker
          image: ghcr.io/maybe-finance/maybe:0.5.0
          command: ["bundle", "exec", "sidekiq"]
          resources:
            requests:
              memory: 200Mi
          envFrom:
            - configMapRef:
                name: maybe-finance-config
            - secretRef:
                name: maybe-finance-secret
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: maybe-finance-valkey
spec:
  replicas: 1
  selector:
    matchLabels:
      app: maybe-finance-valkey
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: maybe-finance-valkey
    spec:
      containers:
        - name: valkey
          image: valkey/valkey:8.1.3-alpine
          ports:
            - containerPort: 6379
              name: redis
          resources:
            requests:
              memory: 25Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
