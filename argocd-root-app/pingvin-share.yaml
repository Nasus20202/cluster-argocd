apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pingvin-share
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Nasus20202/cluster-argocd.git
    targetRevision: main
    path: apps/pingvin-share
  destination:
    name: in-cluster
    namespace: pingvin-share
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
