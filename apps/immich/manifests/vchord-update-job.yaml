apiVersion: batch/v1
kind: Job
metadata:
  name: vchord-update
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: vchord-update
          image: alpine/psql:18.6@sha256:7cd118b8061fa4e7b4e90a16da14b4761da0977f9a2ced983b266dad59410e93
          args:
            - -c
            - "ALTER EXTENSION vchord UPDATE;"
          env:
            - name: PGHOST
              value: immich-postgres-rw
            - name: PGDATABASE
              value: immich
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: immich-postgres-superuser
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: immich-postgres-superuser
                  key: password
