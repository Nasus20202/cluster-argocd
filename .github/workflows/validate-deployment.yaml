name: Deployment validation
run-name: Validate `${{ github.event.head_commit.message }}`

on:
  push:
  pull_request:

jobs:
  validate-manifests:
    name: Validate ${{ github.event.head_commit.message }}

    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build and validate ArgoCD Manifests
        uses: nasus20202/argocd-validate-action@v2
        with:
          apps-dir: "argocd-apps-root-app"
          base-path: ""
          skip-resources: "CustomResourceDefinition"
          state-dir: ".argocd-state"
          comment-on-pr: "true"
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push state
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .argocd-state
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: Update ArgoCD manifest state [skip ci]"
            git push
          fi
