apiVersion: apps/v1
kind: Deployment
metadata:
  name: convertx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: convertx
  template:
    metadata:
      labels:
        app: convertx
    spec:
      containers:
        - name: convertx
          image: ghcr.io/c4illin/convertx
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: HIDE_HISTORY
              value: "true"
            - name: ALLOW_UNAUTHENTICATED
              value: "true"
          resources:
            requests:
              memory: "150Mi"
              cpu: "10m"
            limits:
              memory: "150Mi"
