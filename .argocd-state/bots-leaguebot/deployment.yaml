apiVersion: apps/v1
kind: Deployment
metadata:
  name: leaguebot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: leaguebot
  template:
    metadata:
      labels:
        app: leaguebot
    spec:
      containers:
        - name: leaguebot
          image: ghcr.io/nasus20202/lolbot:1.269.0@sha256:2c830d7a82eac2bf313114e31de54f71bdd895d4e33a77d5605b56e6eb142ce5
          envFrom:
            - secretRef:
                name: leaguebot-secret
          resources:
            requests:
              cpu: 10m
              memory: 50Mi
            limits:
              memory: 100Mi
