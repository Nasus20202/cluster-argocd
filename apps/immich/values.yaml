controllers:
  main:
    containers:
      main:
        image:
          repository: immich-app/immich-server
          tag: v2.0.1
          registry: ghcr.io

immich:
  persistence:
    library:
      existingClaim: immich-library-pvc

server:
  ingress:
    main:
      enabled: true
      annotations:
        cert-manager.io/cluster-issuer: "letsencrypt-prod"
        nginx.ingress.kubernetes.io/proxy-body-size: "0"
      hosts:
        - host: immich.nasus.dev
          paths:
            - path: "/"
      tls:
        - hosts:
            - immich.nasus.dev
          secretName: immich-tls
  controllers:
    main:
      containers:
        main:
          env:
            DB_HOSTNAME: immich-postgres-rw
            DB_DATABASE_NAME: immich
            DB_USERNAME:
              secretKeyRef:
                name: pg-immich
                key: username
            DB_PASSWORD:
              secretKeyRef:
                name: pg-immich
                key: password
          resources:
            requests:
              cpu: 25m
              memory: 500Mi
            limits:
              cpu: 500m
              memory: 1Gi

valkey:
  enabled: true
  controllers:
    main:
      containers:
        main:
          resources:
            requests:
              cpu: 25m
              memory: 25Mi
            limits:
              cpu: 100m
              memory: 50Mi

machine-learning:
  controllers:
    main:
      containers:
        main:
          resources:
            requests:
              cpu: 10m
              memory: 250Mi
            limits:
              cpu: 500m
              memory: 2Gi
