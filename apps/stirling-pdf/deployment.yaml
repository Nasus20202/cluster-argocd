apiVersion: apps/v1
kind: Deployment
metadata:
  name: stirling-pdf
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stirling-pdf
  template:
    metadata:
      labels:
        app: stirling-pdf
    spec:
      containers:
        - name: stirling-pdf
          image: docker.stirlingpdf.com/stirlingtools/stirling-pdf
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              memory: "500Mi"
              cpu: "20m"
            limits:
              memory: "500Mi"
