apiVersion: apps/v1
kind: Deployment
metadata:
  name: uptime-kuma
spec:
  replicas: 1
  selector:
    matchLabels:
      app: uptime-kuma
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: uptime-kuma
    spec:
      containers:
        - name: uptime-kuma
          image: louislam/uptime-kuma:2.5.11@sha256:7554dba313c84e44fee921ef3b5626ba1c711e412e82815e8c957517026112a9
          ports:
            - name: http
              containerPort: 3001
          resources:
            requests:
              cpu: 30m
              memory: 250Mi
            limits:
              memory: 500Mi
          readinessProbe:
            exec:
              command:
                - extra/healthcheck
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - extra/healthcheck
            failureThreshold: 30
          volumeMounts:
            - name: uptime-kuma-data
              mountPath: "/app/data"
      volumes:
        - name: uptime-kuma-data
          persistentVolumeClaim:
            claimName: uptime-kuma-pvc
