apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rybbit-ingress
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
    - host: rybbit.nasus.dev
      http:
        paths:
          - path: /api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: rybbit-backend
                port:
                  name: http
          - path: /()(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: rybbit-client
                port:
                  name: http
  tls:
    - hosts:
        - rybbit.nasus.dev
      secretName: rybbit-tls
