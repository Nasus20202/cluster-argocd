apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: paperless-postgres
spec:
  instances: 1
  primaryUpdateStrategy: unsupervised
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie@sha256:de572898499fab9406f0da51929da562f96f3be40ca79fafea8ec1a8d5b42065
  storage:
    size: 1Gi
  resources:
    requests:
      cpu: 20m
      memory: 125Mi
    limits:
      memory: 250Mi
  bootstrap:
    initdb:
      database: paperless
      owner: paperless
      secret:
        name: pg-paperless
