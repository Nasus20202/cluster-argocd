apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: authentik-postgres
spec:
  instances: 1
  primaryUpdateStrategy: unsupervised
  storage:
    size: 1Gi
  resources:
    requests:
      cpu: 25m
      memory: 125Mi
  bootstrap:
    initdb:
      import:
        type: monolith
        databases: ["authentik"]
        source:
          externalCluster: bitnami-pg
      database: authentik
      owner: authentik
      secret:
        name: pg-authentik
  externalClusters:
    - name: bitnami-pg
      connectionParameters:
        host: postgres-postgresql.postgres
        user: postgres
        dbname: postgres
      password:
        name: bitnami-pg-secret
        key: password
  monitoring:
    enablePodMonitor: true
