apiVersion: v1
kind: ConfigMap
metadata:
  name: paczka-config
data:
  config.yaml: |
    server:
      database: "/paczka/paczka.db"
      sources:
        - path: "/paczka/files"
          name: Paczka
    frontend:
      name: "Paczka"
      disableDefaultLinks: true
    auth:
      tokenExpirationHours: 720
    userDefaults:
      singleClick: true
      locale: pl
      disableSettings: true
      lockPassword: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: paczka-nginx-snippets
data:
  default.conf: |
    server {
      listen 8080;

      location /api/ {
        proxy_pass http://localhost:80;

        # Streaming requirements
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_http_version 1.1;
        add_header X-Accel-Buffering no;

        # Extended timeouts for long-lived streams
        proxy_read_timeout 3600;
        proxy_connect_timeout 3600;
        proxy_send_timeout 3600;
        send_timeout 3600;

        client_max_body_size 10M;
      }

      location / {
        proxy_pass http://localhost:80;

        client_max_body_size 10M;

        sub_filter '</head>' '<script src="https://rybbit.nasus.dev/api/script.js" data-site-id="3" defer></script></head>';
        sub_filter_once on;
        sub_filter_types text/html;
      }
    }
