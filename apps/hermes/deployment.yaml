apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hermes
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: hermes
    spec:
      containers:
        - name: hermes
          image: nousresearch/hermes-agent:v2026.8.3
          args: ["gateway", "run"]
          envFrom:
            - configMapRef:
                name: hermes-cm
            - secretRef:
                name: hermes-secret
          ports:
            - name: http
              containerPort: 9119
          readinessProbe:
            httpGet:
              path: /api/status
              port: http
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: hermes-data
              mountPath: /opt/data
      initContainers:
        - name: bootstrap-config
          image: busybox
          command:
            - sh
            - -c
            - '[ -f /opt/data/config.yaml ] || cp /tmp/hermes-config/config.yaml /opt/data/config.yaml'
          volumeMounts:
            - name: hermes-config
              mountPath: /tmp/hermes-config
              readOnly: true
            - name: hermes-data
              mountPath: /opt/data
      volumes:
        - name: hermes-data
          persistentVolumeClaim:
            claimName: hermes-pvc
        - name: hermes-config
          configMap:
            name: hermes-config
