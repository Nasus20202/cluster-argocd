apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: authentik-postgres
spec:
  instances: 1
  primaryUpdateStrategy: unsupervised
  imageName: ghcr.io/cloudnative-pg/postgresql:19.0-standard-trixie@sha256:6f17393bf934a41fec47439306a17e087c5c2f419ddd5bf4b8dc0241da4bceb0
  storage:
    size: 1Gi
  resources:
    requests:
      cpu: 25m
      memory: 125Mi
    limits:
      memory: 250Mi
  bootstrap:
    initdb:
      database: authentik
      owner: authentik
      secret:
        name: pg-authentik
