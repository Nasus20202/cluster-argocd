apiVersion: apps/v1
kind: Deployment
metadata:
  name: ralphkaminski
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ralphkaminski
  template:
    metadata:
      labels:
        app: ralphkaminski
    spec:
      containers:
        - name: ralphkaminski
          image: ghcr.io/nasus20202/ralphkaminski:1.342.0@sha256:a743a774103e135ef198907136a13ffb97d2765b842b29c6cd49e99472d606f2
          envFrom:
            - configMapRef:
                name: ralphkaminski-cm
            - secretRef:
                name: ralphkaminski-secret
          resources:
            requests:
              memory: 300Mi
              cpu: 10m
            limits:
              memory: 600Mi
