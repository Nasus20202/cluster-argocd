apiVersion: apps/v1
kind: Deployment
metadata:
  name: logenz
spec:
  replicas: 1
  selector:
    matchLabels:
      app: logenz
  template:
    metadata:
      labels:
        app: logenz
    spec:
      containers:
        - name: logenz
          image: ghcr.io/nasus20202/logenz:1.132.0@sha256:82795f1508ade8fe553a6455ca204a9824dfe2ff66febf20dcc8ffab59258b9b
          envFrom:
            - secretRef:
                name: logenz-secret
          resources:
            requests:
              memory: 50Mi
              cpu: 10m
            limits:
              memory: 100Mi
