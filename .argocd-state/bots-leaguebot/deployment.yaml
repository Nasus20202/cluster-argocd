apiVersion: apps/v1
kind: Deployment
metadata:
  name: leaguebot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: leaguebot
  template:
    metadata:
      labels:
        app: leaguebot
    spec:
      containers:
        - name: leaguebot
          image: ghcr.io/nasus20202/lolbot:1.263.0@sha256:653cc719ca126bb5c9b4986cee49a2f3c79b61ec68fe12b9582b89065deaca07
          envFrom:
            - secretRef:
                name: leaguebot-secret
          resources:
            requests:
              cpu: 10m
              memory: 50Mi
            limits:
              memory: 100Mi
