apiVersion: apps/v1
kind: Deployment
metadata:
  name: clickhouse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: clickhouse
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: clickhouse
    spec:
      containers:
        - name: clickhouse
          image: clickhouse/clickhouse-server:26.5.1
          ports:
            - name: http
              containerPort: 8123
            - name: clickhouse
              containerPort: 9000
          volumeMounts:
            - name: data
              mountPath: /var/lib/clickhouse
            - name: config
              mountPath: /etc/clickhouse-server/config.d
          envFrom:
            - secretRef:
                name: clickhouse-secret
          readinessProbe:
            httpGet:
              path: /ping
              port: http
          resources:
            requests:
              cpu: 50m
              memory: 500Mi
            limits:
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: clickhouse-pvc
        - name: config
          configMap:
            name: clickhouse-config
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rybbit-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rybbit-backend
  template:
    metadata:
      labels:
        app: rybbit-backend
    spec:
      containers:
        - name: rybbit-backend
          image: ghcr.io/rybbit-io/rybbit-backend:v2.6.1
          ports:
            - name: http
              containerPort: 3001
          env:
            - name: POSTGRES_DB
              value: rybbit
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: pg-rybbit
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pg-rybbit
                  key: password
          envFrom:
            - configMapRef:
                name: rybbit-config
            - secretRef:
                name: clickhouse-secret
            - secretRef:
                name: better-auth-secret
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
          resources:
            requests:
              cpu: 10m
              memory: 250Mi
            limits:
              memory: 500Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rybbit-client
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rybbit-client
  template:
    metadata:
      labels:
        app: rybbit-client
    spec:
      containers:
        - name: client
          image: ghcr.io/rybbit-io/rybbit-client:v2.6.1
          ports:
            - name: http
              containerPort: 3002
          env:
            - name: NEXT_PUBLIC_BACKEND_URL
              valueFrom:
                configMapKeyRef:
                  name: rybbit-config
                  key: BASE_URL
            - name: NEXT_PUBLIC_DISABLE_SIGNUP
              valueFrom:
                configMapKeyRef:
                  name: rybbit-config
                  key: DISABLE_SIGNUP
          resources:
            requests:
              cpu: 10m
              memory: 125Mi
            limits:
              memory: 250Mi
