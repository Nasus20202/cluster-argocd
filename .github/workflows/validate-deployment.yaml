name: Deployment validation
run-name: Validate `${{ github.event.head_commit.message }}`

on:
  push:

jobs:
  validate-manifests:
    name: Validate ${{ github.event.head_commit.message }}

    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build and validate ArgoCD Manifests
        uses: nasus20202/argocd-validate-action@v2
        with:
          apps-dir: "argocd-apps-root-app"
          base-path: ""
          skip-resources: "CustomResourceDefinition"
          state-dir: ".argocd-state"
