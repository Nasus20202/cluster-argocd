apiVersion: apps/v1
kind: Deployment
metadata:
  name: logenz
spec:
  replicas: 1
  selector:
    matchLabels:
      app: logenz
  template:
    metadata:
      labels:
        app: logenz
    spec:
      containers:
        - name: logenz
          image: ghcr.io/nasus20202/logenz:1.124.0@sha256:c5f495a679eaf2cc6b88352a13f640b49c5ce21b0b76b016b539a8c412ff1e40
          envFrom:
            - secretRef:
                name: logenz-secret
          resources:
            requests:
              memory: 50Mi
              cpu: 10m
            limits:
              memory: 100Mi
