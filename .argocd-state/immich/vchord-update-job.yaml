apiVersion: batch/v1
kind: Job
metadata:
  name: vchord-update
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: vchord-update
          image: alpine/psql:18.6@sha256:53a4692f945419b0c69d00441d134934c3e5edf5a2120f518b8b99ee837c95d0
          args:
            - -c
            - "ALTER EXTENSION vchord UPDATE;"
          env:
            - name: PGHOST
              value: immich-postgres-rw
            - name: PGDATABASE
              value: immich
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: immich-postgres-superuser
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: immich-postgres-superuser
                  key: password
