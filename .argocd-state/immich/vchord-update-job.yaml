apiVersion: batch/v1
kind: Job
metadata:
  name: vchord-update
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: vchord-update
          image: alpine/psql:18.6@sha256:e50da8a269925b53c1a221f0670e206754bcc161227c6c1e8637ef0ea98b6972
          args:
            - -c
            - "ALTER EXTENSION vchord UPDATE;"
          env:
            - name: PGHOST
              value: immich-postgres-rw
            - name: PGDATABASE
              value: immich
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: immich-postgres-superuser
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: immich-postgres-superuser
                  key: password
