immich:
  persistence:
    library:
      existingClaim: immich-library-pvc

server:
  controllers:
    main:
      containers:
        main:
          image:
            repository: ghcr.io/immich-app/immich-server
            tag: v3.4.1@sha256:7c489add298fc2f92cda4c777de6462aa206877e04087b815f62c7664af0b53b
          env:
            DB_HOSTNAME: immich-postgres-rw
            DB_DATABASE_NAME: immich
            DB_USERNAME:
              secretKeyRef:
                name: pg-immich
                key: username
            DB_PASSWORD:
              secretKeyRef:
                name: pg-immich
                key: password
          resources:
            requests:
              cpu: 25m
              memory: 500Mi
            limits:
              memory: 1Gi
  ingress:
    main:
      enabled: true
      annotations:
        cert-manager.io/cluster-issuer: "letsencrypt-prod"
      hosts:
        - host: immich.nasus.dev
          paths:
            - path: "/"
      tls:
        - hosts:
            - immich.nasus.dev
          secretName: immich-tls

valkey:
  enabled: true
  controllers:
    main:
      containers:
        main:
          resources:
            requests:
              cpu: 20m
              memory: 25Mi
            limits:
              memory: 50Mi

machine-learning:
  controllers:
    main:
      containers:
        main:
          image:
            repository: ghcr.io/immich-app/immich-machine-learning
            tag: v3.4.1@sha256:8adebf414256f6e4f837bfbb66fa94f14f4da7260e3a1d65cbba49e4e35d8764
          resources:
            requests:
              cpu: 10m
              memory: 250Mi
            limits:
              memory: 2Gi
