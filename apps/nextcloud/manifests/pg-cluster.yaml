apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: nextcloud-postgres
spec:
  instances: 1
  primaryUpdateStrategy: unsupervised
  storage:
    size: 1Gi
  resources:
    requests:
      cpu: 20m
      memory: 125Mi
    limits:
      memory: 250Mi
  bootstrap:
    initdb:
      database: nextcloud
      owner: nextcloud
      secret:
        name: pg-nextcloud
  monitoring:
    enablePodMonitor: true
