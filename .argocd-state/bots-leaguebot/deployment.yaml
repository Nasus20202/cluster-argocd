apiVersion: apps/v1
kind: Deployment
metadata:
  name: leaguebot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: leaguebot
  template:
    metadata:
      labels:
        app: leaguebot
    spec:
      containers:
        - name: leaguebot
          image: ghcr.io/nasus20202/lolbot:1.257.0@sha256:464cb329015b6216ae7f4cf03a5f3a321b93a820990777f8f6e3439846b2e936
          envFrom:
            - secretRef:
                name: leaguebot-secret
          resources:
            requests:
              cpu: 10m
              memory: 50Mi
            limits:
              memory: 100Mi
