nextcloud:
  host: cloud.nasus.dev

persistence:
  enabled: true
  size: 30Gi

internalDatabase:
  enabled: false

externalDatabase:
  enabled: true
  type: postgresql
  host: nextcloud-postgres-rw
  database: nextcloud
  existingSecret:
    enabled: true
    secretName: pg-nextcloud
    usernameKey: username
    passwordKey: password

cronjob:
  enabled: true

resources:
  requests:
    cpu: 10m
    memory: 250Mi
  limits:
    memory: 500Mi

ingress:
  enabled: true
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  tls:
    - secretName: nextcloud-tls
      hosts:
        - cloud.nasus.dev

startupProbe: # For automated upgrades
  enabled: true
  periodSeconds: 5
  timeoutSeconds: 5
  failureThreshold: 100
