apiVersion: apps/v1
kind: Deployment
metadata:
  name: ralphkaminski
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ralphkaminski
  template:
    metadata:
      labels:
        app: ralphkaminski
    spec:
      containers:
        - name: ralphkaminski
          image: ghcr.io/nasus20202/ralphkaminski:1.322.0@sha256:f9f45b6ff64f361af5d5d4f8e2329be0056f98628f24c6c4329d6b712f7bfae0
          envFrom:
            - configMapRef:
                name: ralphkaminski-cm
            - secretRef:
                name: ralphkaminski-secret
          resources:
            requests:
              memory: 300Mi
              cpu: 10m
            limits:
              memory: 600Mi
