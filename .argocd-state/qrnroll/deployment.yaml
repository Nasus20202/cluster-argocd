apiVersion: apps/v1
kind: Deployment
metadata:
  name: qrnroll
spec:
  replicas: 2
  selector:
    matchLabels:
      app: qrnroll
  template:
    metadata:
      labels:
        app: qrnroll
    spec:
      containers:
        - name: qrnroll
          image: ghcr.io/nasus20202/qrnroll:1.1293.0@sha256:315e40f454df5a15fe4ffeb6418b3720a285d75871e221008a25a2a1ec5beba1
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: VALKEY_URL
              value: "valkey://qrnroll-valkey:6379"
            - name: TRACKING_SCRIPT
              value: '<script src="https://rybbit.nasus.dev/api/script.js" data-site-id="5d0970295e63" defer></script>'
          envFrom:
            - secretRef:
                name: qrnroll-secret
          readinessProbe:
            httpGet:
              path: /
              port: http
          resources:
            requests:
              cpu: 10m
              memory: 75Mi
            limits:
              memory: 150Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qrnroll-valkey
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qrnroll-valkey
  template:
    metadata:
      labels:
        app: qrnroll-valkey
    spec:
      containers:
        - name: valkey
          image: valkey/valkey:9.1.3-alpine@sha256:bf09d58e96d6b4524a15396b65b242bbe18beebbcc15a04d8ee75ddac62fae0b
          ports:
            - containerPort: 6379
              name: valkey
          resources:
            requests:
              cpu: 10m
              memory: 10Mi
            limits:
              memory: 20Mi
          readinessProbe:
            tcpSocket:
              port: valkey
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
