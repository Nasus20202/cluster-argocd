apiVersion: apps/v1
kind: Deployment
metadata:
  name: logenz
spec:
  replicas: 1
  selector:
    matchLabels:
      app: logenz
  template:
    metadata:
      labels:
        app: logenz
    spec:
      containers:
        - name: logenz
          image: ghcr.io/nasus20202/logenz:1.130.0@sha256:4ef8527c7f86a400446add9c5d392c2de6300cac3d8e0da3182293d2268bc901
          envFrom:
            - secretRef:
                name: logenz-secret
          resources:
            requests:
              memory: 50Mi
              cpu: 10m
            limits:
              memory: 100Mi
