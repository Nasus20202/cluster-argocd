apiVersion: apps/v1
kind: Deployment
metadata:
  name: janr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: janr
  template:
    metadata:
      labels:
        app: janr
    spec:
      containers:
        - name: janr
          image: ghcr.io/nasus20202/janr:1.339.0@sha256:2608222c797c70bb5c3402fd3016f9c2f0dcad93145c6b79abd974bb1bd5d00a
          envFrom:
            - configMapRef:
                name: janr-cm
            - secretRef:
                name: janr-secret
          resources:
            requests:
              memory: 100Mi
              cpu: 10m
            limits:
              memory: 200Mi
      imagePullSecrets:
        - name: janr-registry-secret
