apiVersion: apps/v1
kind: Deployment
metadata:
  name: ralphkaminski
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ralphkaminski
  template:
    metadata:
      labels:
        app: ralphkaminski
    spec:
      containers:
        - name: ralphkaminski
          image: ghcr.io/nasus20202/ralphkaminski:1.312.0@sha256:867a109294132c1112ff1ecd89dd402d8bb7c2dcc962eeed6799619a5c09baf4
          envFrom:
            - configMapRef:
                name: ralphkaminski-cm
            - secretRef:
                name: ralphkaminski-secret
          resources:
            requests:
              memory: 300Mi
              cpu: 10m
            limits:
              memory: 600Mi
