apiVersion: apps/v1
kind: Deployment
metadata:
  name: leaguebot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: leaguebot
  template:
    metadata:
      labels:
        app: leaguebot
    spec:
      containers:
        - name: leaguebot
          image: ghcr.io/nasus20202/lolbot:1.259.0@sha256:d62550ae4038380456aaeb3ea481e0f05c6c43790ddd81c28d99b8ab3e391c72
          envFrom:
            - secretRef:
                name: leaguebot-secret
          resources:
            requests:
              cpu: 10m
              memory: 50Mi
            limits:
              memory: 100Mi
