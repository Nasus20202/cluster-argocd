apiVersion: apps/v1
kind: Deployment
metadata:
  name: janr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: janr
  template:
    metadata:
      labels:
        app: janr
    spec:
      containers:
        - name: janr
          image: ghcr.io/nasus20202/janr:1.341.0@sha256:23ac8be08f713bb05ea2b6205f7e76f8878decc6fc9a6fb2e3ee6e42de785a1a
          envFrom:
            - configMapRef:
                name: janr-cm
            - secretRef:
                name: janr-secret
          resources:
            requests:
              memory: 100Mi
              cpu: 10m
            limits:
              memory: 200Mi
      imagePullSecrets:
        - name: janr-registry-secret
