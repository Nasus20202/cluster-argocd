apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: rybbit-postgres
spec:
  instances: 1
  primaryUpdateStrategy: unsupervised
  imageName: ghcr.io/cloudnative-pg/postgresql:18.7-standard-trixie@sha256:1abcfd1cac6d53cda5185706819aab36d66a4ed88e99fc2ae44ab0826aa99f00
  storage:
    size: 1Gi
  resources:
    requests:
      cpu: 20m
      memory: 125Mi
    limits:
      memory: 250Mi
  bootstrap:
    initdb:
      database: rybbit
      owner: rybbit
      secret:
        name: pg-rybbit
