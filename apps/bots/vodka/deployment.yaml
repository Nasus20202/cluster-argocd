apiVersion: apps/v1
kind: Deployment
metadata:
  name: vodka
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vodka
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: vodka
    spec:
      containers:
        - name: vodka
          image: ghcr.io/nasus20202/vodka:1.191.0@sha256:332ad813b892694e7a423c177df9934f112a65f8a1e0e904574d9bbdf8c1bb16
          envFrom:
            - configMapRef:
                name: vodka-cm
            - secretRef:
                name: vodka-secret
          resources:
            requests:
              memory: 50Mi
              cpu: 10m
            limits:
              memory: 100Mi
          volumeMounts:
            - name: vodka-data
              mountPath: "/app/data"
      volumes:
        - name: vodka-data
          persistentVolumeClaim:
            claimName: vodka-pvc
