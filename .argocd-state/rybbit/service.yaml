apiVersion: v1
kind: Service
metadata:
  name: clickhouse
spec:
  selector:
    app: clickhouse
  ports:
    - name: http
      port: 8123
      targetPort: 8123
    - name: clickhouse
      port: 9000
      targetPort: 9000
---
apiVersion: v1
kind: Service
metadata:
  name: rybbit-backend
spec:
  selector:
    app: rybbit-backend
  ports:
    - name: http
      port: 3001
      targetPort: 3001
---
apiVersion: v1
kind: Service
metadata:
  name: rybbit-client
spec:
  selector:
    app: rybbit-client
  ports:
    - name: http
      port: 3002
      targetPort: 3002
